name: npm CLI Smoke

on:
  push:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "bootstrap/**"
      - "scripts/**"
      - "pack/agents/**"
      - "pack/rules/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/npm-cli-smoke.yml"
  pull_request:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "bootstrap/**"
      - "scripts/**"
      - "pack/agents/**"
      - "pack/rules/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/npm-cli-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version consistency
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$PACKAGE_VERSION" = "$FILE_VERSION"
          echo "Release version: $PACKAGE_VERSION"

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Build npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      - name: Create sample web project
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          mkdir -p "$SAMPLE/src"
          cat > "$SAMPLE/package.json" <<'JSON'
          {
            "name": "web-kit-smoke-app",
            "dependencies": {
              "react": "^19.0.0"
            },
            "devDependencies": {
              "typescript": "^5.0.0"
            }
          }
          JSON
          echo '{}' > "$SAMPLE/tsconfig.json"
          echo 'export const App = () => null;' > "$SAMPLE/src/App.tsx"

      - name: Test packaged CLI scan
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "./${{ steps.pack.outputs.tarball }}" scan \
            --ref main \
            --project "$RUNNER_TEMP/web-kit-sample"

      - name: Test packaged CLI install
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          npx --yes "./${{ steps.pack.outputs.tarball }}" install \
            --ref main \
            --project "$SAMPLE"

          test -f "$SAMPLE/AGENTS.md"
          test -f "$SAMPLE/CLAUDE.md"
          test -f "$SAMPLE/GEMINI.md"
          test -f "$SAMPLE/.github/copilot-instructions.md"
          test -f "$SAMPLE/.cursor/rules/ihgen-web-kit.mdc"
          test ! -e "$SAMPLE/AGENTS.web-kit.md"
          test -f "$SAMPLE/.agent-kit.json"
          test -f "$SAMPLE/.agent-kit-source.json"
          test -f "$SAMPLE/.agent-core/index/project-profile.json"
          test -f "$SAMPLE/.agent-core/rules/workflow.md"
          test -f "$SAMPLE/.agent-core/rules/graphify-refresh.py"
          test -f "$SAMPLE/.agent-core/rules/graphify-setup.py"
          test -f "$SAMPLE/.agent-core/rules/repository-navigation.md"
          test -f "$SAMPLE/.agent-core/bin/remote-install.py"

          grep -q "web-kit-smoke-app" "$SAMPLE/AGENTS.md"
          grep -q "WEB-AGENT-KIT:PROJECT-SUMMARY:START" "$SAMPLE/AGENTS.md"
          grep -q "WEB-AGENT-KIT:AI-ROLES:START" "$SAMPLE/AGENTS.md"
          grep -q ".agent-core/rules/workflow.md" "$SAMPLE/AGENTS.md"
          grep -q ".agent-core/rules/repository-navigation.md" "$SAMPLE/AGENTS.md"
          grep -q "graphify-bootstrap-role.md" "$SAMPLE/AGENTS.md"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ["RUNNER_TEMP"]) / "web-kit-sample"
          profile = json.loads((sample / ".agent-core/index/project-profile.json").read_text())
          graphify = profile["capabilities"]["graphify"]
          assert graphify["detected"] is False
          assert graphify["graph_ready"] is False
          assert graphify["routing_mode"] == "standard"
          cfg = json.loads((sample / '.agent-kit.json').read_text())
          assert cfg['ai_compatibility']['canonical_instructions'] == 'AGENTS.md'
          assert cfg['ai_compatibility']['managed_roles']['claude'] == 'CLAUDE.md'
          PY

      - name: Test smart mode on current installation
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/smart-current.log"
          npx --yes "./${{ steps.pack.outputs.tarball }}" \
            --project "$RUNNER_TEMP/web-kit-sample" | tee "$OUTPUT"

          grep -q "Mode:      smart" "$OUTPUT"
          grep -q "Decision:  doctor" "$OUTPUT"
          grep -q "already installed" "$OUTPUT"

      - name: Test update detects Graphify and refreshes canonical loop
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          mkdir -p "$SAMPLE/graphify-out"
          echo '{"nodes": [], "edges": []}' > "$SAMPLE/graphify-out/graph.json"
          cat > "$SAMPLE/.mcp.json" <<'JSON'
          {
            "mcpServers": {
              "graphify": {
                "command": "python",
                "args": ["-m", "graphify.serve", "graphify-out/graph.json"]
              }
            }
          }
          JSON

          npx --yes "./${{ steps.pack.outputs.tarball }}" update \
            --ref main \
            --project "$SAMPLE"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ["RUNNER_TEMP"]) / "web-kit-sample"
          profile = json.loads((sample / ".agent-core/index/project-profile.json").read_text())
          config = json.loads((sample / ".agent-kit.json").read_text())
          graphify = profile["capabilities"]["graphify"]
          assert graphify["detected"] is True
          assert graphify["graph_ready"] is True
          assert graphify["local_mcp_configured"] is True
          assert graphify["routing_mode"] == "graphify-assisted"
          assert config["capabilities"]["graphify"]["routing_mode"] == "graphify-assisted"
          agents = (sample / 'AGENTS.md').read_text()
          assert agents.count('<!-- WEB-AGENT-KIT:AI-ROLES:START -->') == 1
          # Initial project summary is intentionally not rewritten by updates.
          assert 'WEB-AGENT-KIT:PROJECT-SUMMARY:START' in agents
          PY

          grep -q "Direct source lookup" "$SAMPLE/.agent-core/rules/workflow.md"
          grep -q "Relationship / dependency / impact discovery" "$SAMPLE/.agent-core/rules/workflow.md"
          grep -q "Graph Refresh Gate" "$SAMPLE/.agent-core/rules/workflow.md"
          grep -q "Post-step Graph Refresh Gate" "$SAMPLE/.agent-core/agents/context-router.md"

      - name: Test Graphify freshness gate refreshes once per changed state
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          MOCK_BIN="$RUNNER_TEMP/mock-bin"
          LOG="$RUNNER_TEMP/graphify-calls.log"
          mkdir -p "$MOCK_BIN"
          : > "$LOG"

          cat > "$MOCK_BIN/graphify" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$*" >> "$GRAPHIFY_TEST_LOG"
          if [ "${GRAPHIFY_MOCK_FAIL:-0}" = "1" ]; then
            exit 9
          fi
          exit 0
          SH
          chmod +x "$MOCK_BIN/graphify"

          GATE="$SAMPLE/.agent-core/rules/graphify-refresh.py"

          PATH="$MOCK_BIN:$PATH" GRAPHIFY_TEST_LOG="$LOG" \
            python "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(wc -l < "$LOG")" -eq 1
          grep -q '^update \.$' "$LOG"

          PATH="$MOCK_BIN:$PATH" GRAPHIFY_TEST_LOG="$LOG" \
            python "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(wc -l < "$LOG")" -eq 1

          echo 'export const App = () => "changed";' > "$SAMPLE/src/App.tsx"
          PATH="$MOCK_BIN:$PATH" GRAPHIFY_TEST_LOG="$LOG" \
            python "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(wc -l < "$LOG")" -eq 2

          echo 'export const App = () => "changed-again";' > "$SAMPLE/src/App.tsx"
          PATH="$MOCK_BIN:$PATH" GRAPHIFY_TEST_LOG="$LOG" GRAPHIFY_MOCK_FAIL=1 \
            python "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(wc -l < "$LOG")" -eq 3

          PATH="$MOCK_BIN:$PATH" GRAPHIFY_TEST_LOG="$LOG" \
            python "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(wc -l < "$LOG")" -eq 3

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ["RUNNER_TEMP"]) / "web-kit-sample"
          state = json.loads((sample / ".agent-core/state/graphify.json").read_text())
          assert state["routing_mode"] == "standard"
          assert state["fallback_for_task"] is True
          assert state["fallback_task_id"] == "task-1"
          assert state["dirty"] is True
          PY

      - name: Test no silent downgrade for newer project
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "web-kit-sample" / ".agent-kit.json"
          data = json.loads(p.read_text())
          data["version"] = "9.0.0"
          p.write_text(json.dumps(data, indent=2))
          PY

          OUTPUT="$RUNNER_TEMP/smart-newer.log"
          npx --yes "./${{ steps.pack.outputs.tarball }}" \
            --project "$SAMPLE" | tee "$OUTPUT"

          grep -q "newer than npm CLI" "$OUTPUT"
          grep -q "Decision:  doctor" "$OUTPUT"

      - name: Test explicit downgrade protection
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          set +e
          OUTPUT="$(npx --yes "./${{ steps.pack.outputs.tarball }}" update \
            --ref v1.1.5 \
            --project "$SAMPLE" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          test "$STATUS" -eq 3
          echo "$OUTPUT" | grep -q "Refusing downgrade"

      - name: Test packaged CLI doctor explicitly
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd()
          p = Path(os.environ["RUNNER_TEMP"]) / "web-kit-sample" / ".agent-kit.json"
          data = json.loads(p.read_text())
          package = json.loads((root / "package.json").read_text())
          data["version"] = package["version"]
          p.write_text(json.dumps(data, indent=2))
          PY

          npx --yes "./${{ steps.pack.outputs.tarball }}" doctor \
            --project "$SAMPLE"
