name: npm CLI Smoke

on:
  push:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "bootstrap/**"
      - "scripts/**"
      - "pack/agents/**"
      - "pack/rules/**"
      - "pack/runtime/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/npm-cli-smoke.yml"
  pull_request:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "bootstrap/**"
      - "scripts/**"
      - "pack/agents/**"
      - "pack/rules/**"
      - "pack/runtime/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/npm-cli-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Node sources and release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$(tr -d '\r\n' < VERSION)"
          node --check bin/web-kit.js
          node --check bootstrap/remote-install.mjs
          node --check scripts/agent-kit.mjs
          node --check scripts/project-profile.mjs
          node --check scripts/ai-compat.mjs
          node --check pack/rules/graphify-setup.mjs
          node --check pack/rules/graphify-refresh.mjs
          node --check pack/runtime/session-controller.mjs
          node bin/web-kit.js --help | grep -q 'session codex'
          node bin/web-kit.js --help | grep -q 'session claude'
          node bin/web-kit.js --help | grep -q 'codex-sandbox'
          node bin/web-kit.js --help | grep -q 'claude-permission-mode'

      - name: Prove Web Kit does not call Python
        shell: bash
        run: |
          set -euo pipefail
          MOCK="$RUNNER_TEMP/no-python"
          LOG="$RUNNER_TEMP/python-calls.log"
          mkdir -p "$MOCK"
          : > "$LOG"
          for name in python python3 py; do
            cat > "$MOCK/$name" <<'SH'
          #!/usr/bin/env bash
          echo "${0##*/} $*" >> "$WEB_KIT_PYTHON_CALL_LOG"
          exit 97
          SH
            chmod +x "$MOCK/$name"
          done
          echo "$MOCK" >> "$GITHUB_PATH"
          echo "WEB_KIT_PYTHON_CALL_LOG=$LOG" >> "$GITHUB_ENV"

      - name: Validate npm package contents
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(npm pack --dry-run 2>&1)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'bootstrap/remote-install.mjs'
          ! echo "$OUTPUT" | grep -q 'bootstrap/remote-install.py'

      - name: Build npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Create sample web project
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          mkdir -p "$SAMPLE/src"
          cat > "$SAMPLE/package.json" <<'JSON'
          {
            "name": "web-kit-smoke-app",
            "dependencies": {"react": "^19.0.0"},
            "devDependencies": {"typescript": "^5.0.0"}
          }
          JSON
          echo '{}' > "$SAMPLE/tsconfig.json"
          echo 'export const App = () => null;' > "$SAMPLE/src/App.tsx"

      - name: Test packaged CLI scan and install without Python
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          TARBALL="./${{ steps.pack.outputs.tarball }}"

          npx --yes "$TARBALL" scan --ref main --project "$SAMPLE"
          npx --yes "$TARBALL" install --ref main --project "$SAMPLE"

          test -f "$SAMPLE/AGENTS.md"
          test -f "$SAMPLE/CLAUDE.md"
          test -f "$SAMPLE/GEMINI.md"
          test -f "$SAMPLE/.github/copilot-instructions.md"
          test -f "$SAMPLE/.cursor/rules/ihgen-web-kit.mdc"
          test ! -e "$SAMPLE/AGENTS.web-kit.md"
          test -f "$SAMPLE/.agent-kit.json"
          test -f "$SAMPLE/.agent-kit-source.json"
          test -f "$SAMPLE/.agent-core/index/project-profile.json"
          test -f "$SAMPLE/.agent-core/rules/workflow.md"
          test -f "$SAMPLE/.agent-core/rules/graphify-refresh.mjs"
          test -f "$SAMPLE/.agent-core/rules/graphify-setup.mjs"
          test -f "$SAMPLE/.agent-core/rules/repository-navigation.md"
          test -f "$SAMPLE/.agent-core/rules/context-rollover.md"
          test -f "$SAMPLE/.agent-core/agents/context-rollover-manager.md"
          test -f "$SAMPLE/.agent-core/bin/session-controller.mjs"
          test -f "$SAMPLE/.agent-core/bin/web-kit-update.mjs"
          test ! -e "$SAMPLE/.agent-core/rules/graphify-refresh.py"
          test ! -e "$SAMPLE/.agent-core/rules/graphify-setup.py"
          test ! -e "$SAMPLE/.agent-core/bin/remote-install.py"

          grep -q 'WEB-AGENT-KIT:PROJECT-SUMMARY:START' "$SAMPLE/AGENTS.md"
          grep -q 'WEB-AGENT-KIT:AI-ROLES:START' "$SAMPLE/AGENTS.md"
          grep -q 'graphify-refresh.mjs' "$SAMPLE/AGENTS.md"
          grep -q 'WEB_KIT_SESSION_CONTROLLER=1' "$SAMPLE/AGENTS.md"
          grep -q 'context-handoff.json' "$SAMPLE/AGENTS.md"

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const profile = JSON.parse(fs.readFileSync(path.join(sample, '.agent-core/index/project-profile.json'), 'utf8'));
          const cfg = JSON.parse(fs.readFileSync(path.join(sample, '.agent-kit.json'), 'utf8'));
          const policy = JSON.parse(fs.readFileSync(path.join(sample, '.agent-core/routing/context-policy.json'), 'utf8'));
          if (profile.capabilities.graphify.detected !== false) process.exit(1);
          if (profile.capabilities.graphify.graph_ready !== false) process.exit(1);
          if (profile.capabilities.graphify.routing_mode !== 'standard') process.exit(1);
          if (cfg.runtime !== 'node+npm') process.exit(1);
          if (cfg.ai_compatibility.runtime !== 'node+npm') process.exit(1);
          if (cfg.ai_compatibility.context_rollover_threshold_percent !== 50) process.exit(1);
          if (cfg.ai_compatibility.session_controller !== '.agent-core/bin/session-controller.mjs') process.exit(1);
          if (policy.version !== 6 || policy.session_control.default_rollover_threshold_percent !== 50) process.exit(1);
          NODE

      - name: Test non-destructive update
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          TARBALL="./${{ steps.pack.outputs.tarball }}"
          echo 'PROJECT OWNED CLAUDE RULE' >> "$SAMPLE/CLAUDE.md"
          BEFORE="$(sed '/WEB-AGENT-KIT:AI-ROLES:START/,/WEB-AGENT-KIT:AI-ROLES:END/d' "$SAMPLE/CLAUDE.md")"
          npx --yes "$TARBALL" update --ref main --project "$SAMPLE"
          AFTER="$(sed '/WEB-AGENT-KIT:AI-ROLES:START/,/WEB-AGENT-KIT:AI-ROLES:END/d' "$SAMPLE/CLAUDE.md")"
          test "$BEFORE" = "$AFTER"
          grep -q 'PROJECT OWNED CLAUDE RULE' "$SAMPLE/CLAUDE.md"
          test "$(grep -c 'WEB-AGENT-KIT:AI-ROLES:START' "$SAMPLE/CLAUDE.md")" -eq 1

      - name: Test smart mode on current installation
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/smart-current.log"
          npx --yes "./${{ steps.pack.outputs.tarball }}" --project "$RUNNER_TEMP/web-kit-sample" | tee "$OUTPUT"
          grep -q 'Decision:  doctor' "$OUTPUT"
          grep -q 'Runtime:   Node.js' "$OUTPUT"
          grep -q 'Session Controller: OK' "$OUTPUT"
          grep -q 'Context rollover rule: OK' "$OUTPUT"

      - name: Test Graphify detection and Node freshness gate
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          TARBALL="./${{ steps.pack.outputs.tarball }}"
          mkdir -p "$SAMPLE/graphify-out"
          echo '{"nodes": [], "edges": []}' > "$SAMPLE/graphify-out/graph.json"
          cat > "$SAMPLE/.mcp.json" <<'JSON'
          {"mcpServers":{"graphify":{"command":"managed-by-uv","args":["graphify-out/graph.json"]}}}
          JSON
          npx --yes "$TARBALL" update --ref main --project "$SAMPLE"

          MOCK="$RUNNER_TEMP/mock-graphify"
          LOG="$RUNNER_TEMP/graphify-calls.log"
          mkdir -p "$MOCK"
          : > "$LOG"
          cat > "$MOCK/graphify" <<'SH'
          #!/usr/bin/env bash
          echo "$*" >> "$GRAPHIFY_TEST_LOG"
          if [ "${GRAPHIFY_MOCK_FAIL:-0}" = "1" ] && [ "${1:-}" = "update" ]; then exit 9; fi
          exit 0
          SH
          chmod +x "$MOCK/graphify"
          export WEB_KIT_GRAPHIFY_BIN="$MOCK/graphify"
          export GRAPHIFY_TEST_LOG="$LOG"
          GATE="$SAMPLE/.agent-core/rules/graphify-refresh.mjs"

          node "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(grep -c '^update \.$' "$LOG")" -eq 1
          node "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(grep -c '^update \.$' "$LOG")" -eq 1

          echo 'export const App = () => "changed";' > "$SAMPLE/src/App.tsx"
          node "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(grep -c '^update \.$' "$LOG")" -eq 2

          echo 'export const App = () => "changed-again";' > "$SAMPLE/src/App.tsx"
          GRAPHIFY_MOCK_FAIL=1 node "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(grep -c '^update \.$' "$LOG")" -eq 3
          node "$GATE" --project "$SAMPLE" --task-id task-1
          test "$(grep -c '^update \.$' "$LOG")" -eq 3

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const state = JSON.parse(fs.readFileSync(path.join(sample, '.agent-core/state/graphify.json'), 'utf8'));
          if (state.runtime !== 'node') process.exit(1);
          if (state.routing_mode !== 'standard' || !state.fallback_for_task || !state.dirty) process.exit(1);
          NODE

      - name: Test downgrade protection and doctor
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-sample"
          TARBALL="./${{ steps.pack.outputs.tarball }}"

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const p = path.join(sample, '.agent-kit.json');
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          data.version = '9.0.0';
          fs.writeFileSync(p, JSON.stringify(data, null, 2));
          NODE

          OUTPUT="$(npx --yes "$TARBALL" --project "$SAMPLE")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'newer than npm CLI'

          set +e
          DOWNGRADE="$(npx --yes "$TARBALL" update --ref v1.1.5 --project "$SAMPLE" 2>&1)"
          STATUS=$?
          set -e
          test "$STATUS" -eq 3
          echo "$DOWNGRADE" | grep -q 'Refusing downgrade'

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const p = path.join(sample, '.agent-kit.json');
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          data.version = require(path.join(process.cwd(), 'package.json')).version;
          fs.writeFileSync(p, JSON.stringify(data, null, 2));
          NODE
          npx --yes "$TARBALL" doctor --project "$SAMPLE"

      - name: Assert Python was never invoked
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$WEB_KIT_PYTHON_CALL_LOG" ]; then
            echo 'Unexpected Python calls:'
            cat "$WEB_KIT_PYTHON_CALL_LOG"
            exit 1
          fi
