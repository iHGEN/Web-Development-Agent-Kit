name: Apply Security Artifact History Fix

on:
  push:
    branches: [ts-security-review-engine]
    paths:
      - ".github/workflows/apply-security-artifact-history-fix.yml"
      - "scripts/apply-security-artifact-history-fix.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ts-security-review-engine
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-security-artifact-history-fix.mjs
          node --check pack/runtime/security-review.mjs
          node --check tests/security-review-smoke.mjs
          git diff --check

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-security-artifact-history-fix.yml
          rm -f scripts/apply-security-artifact-history-fix.mjs
          git config user.name "Web Kit CI"
          git config user.email "web-kit-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make scanner evidence immutable per review"
          git push origin HEAD:ts-security-review-engine
