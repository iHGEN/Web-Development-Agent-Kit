name: AI Compatibility + Graphify Smoke

on:
  push:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "scripts/**"
      - "pack/rules/**"
      - "pack/agents/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/ai-compat-graphify-smoke.yml"
  pull_request:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "scripts/**"
      - "pack/rules/**"
      - "pack/agents/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/ai-compat-graphify-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create sample project with existing AI instructions
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          mkdir -p "$SAMPLE/src"
          cat > "$SAMPLE/package.json" <<'JSON'
          {"name":"web-kit-ai-sample","dependencies":{"react":"^19.0.0"}}
          JSON
          echo 'export const value = 1;' > "$SAMPLE/src/index.ts"
          cat > "$SAMPLE/AGENTS.md" <<'TXT'
          # Existing AGENTS instructions

          Keep this project-owned AGENTS content exactly.
          TXT
          cat > "$SAMPLE/CLAUDE.md" <<'TXT'
          # Existing Claude instructions

          Keep this project-owned Claude content exactly.
          TXT
          cat > "$SAMPLE/GEMINI.md" <<'TXT'
          # Existing Gemini instructions

          Keep this project-owned Gemini content exactly.
          TXT
          cp "$SAMPLE/AGENTS.md" "$RUNNER_TEMP/original-AGENTS.md"
          cp "$SAMPLE/CLAUDE.md" "$RUNNER_TEMP/original-CLAUDE.md"
          cp "$SAMPLE/GEMINI.md" "$RUNNER_TEMP/original-GEMINI.md"

      - name: Install Web Kit and verify non-destructive AI roles
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          python scripts/agent-kit.py install "$SAMPLE"

          test -f "$SAMPLE/AGENTS.md"
          test -f "$SAMPLE/CLAUDE.md"
          test -f "$SAMPLE/GEMINI.md"
          test -f "$SAMPLE/.github/copilot-instructions.md"
          test -f "$SAMPLE/.cursor/rules/ihgen-web-kit.mdc"
          test ! -e "$SAMPLE/AGENTS.web-kit.md"
          test -f "$SAMPLE/.agent-core/rules/ai-compatibility.md"
          test -f "$SAMPLE/.agent-core/rules/graphify-setup.py"
          test -f "$SAMPLE/.agent-core/rules/graphify-refresh.py"
          test -f "$SAMPLE/.agent-core/rules/repository-navigation.md"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          rt = Path(os.environ['RUNNER_TEMP'])
          for name in ('AGENTS.md', 'CLAUDE.md', 'GEMINI.md'):
              original = (rt / f'original-{name}').read_text()
              current = (sample / name).read_text()
              assert current.startswith(original), name
              assert '<!-- WEB-AGENT-KIT:AI-ROLES:START -->' in current
              assert '<!-- WEB-AGENT-KIT:PROJECT-SUMMARY:START -->' not in current
              assert current.count('<!-- WEB-AGENT-KIT:AI-ROLES:START -->') == 1

          # These files did not exist, so they receive a one-time project summary plus roles.
          for rel in ('.github/copilot-instructions.md', '.cursor/rules/ihgen-web-kit.mdc'):
              text = (sample / rel).read_text()
              assert '<!-- WEB-AGENT-KIT:PROJECT-SUMMARY:START -->' in text
              assert 'web-kit-ai-sample' in text
              assert '<!-- WEB-AGENT-KIT:AI-ROLES:START -->' in text

          cfg = json.loads((sample / '.agent-kit.json').read_text())
          compat = cfg['ai_compatibility']
          assert 'codex' in compat['native_agents_md']
          assert 'kimi' in compat['native_agents_md']
          assert compat['managed_roles']['claude'] == 'CLAUDE.md'
          assert compat['managed_roles']['gemini'] == 'GEMINI.md'
          assert compat['temporary_graphify_role'] == '.agent-core/state/graphify-bootstrap-role.md'
          PY

          # A second update must still preserve project-owned text and keep one roles block.
          python scripts/agent-kit.py update "$SAMPLE"
          python - <<'PY'
          import os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          rt = Path(os.environ['RUNNER_TEMP'])
          for name in ('AGENTS.md', 'CLAUDE.md', 'GEMINI.md'):
              original = (rt / f'original-{name}').read_text()
              current = (sample / name).read_text()
              assert current.startswith(original), name
              assert current.count('<!-- WEB-AGENT-KIT:AI-ROLES:START -->') == 1
          PY

      - name: Verify missing instruction files get one-time project summaries
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-empty-ai-sample"
          mkdir -p "$SAMPLE/src"
          cat > "$SAMPLE/package.json" <<'JSON'
          {"name":"empty-ai-project","dependencies":{"react":"^19.0.0"}}
          JSON
          echo 'export const value = 1;' > "$SAMPLE/src/index.ts"
          python scripts/agent-kit.py install "$SAMPLE"

          for rel in AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md .cursor/rules/ihgen-web-kit.mdc; do
            test -f "$SAMPLE/$rel"
            grep -q 'WEB-AGENT-KIT:PROJECT-SUMMARY:START' "$SAMPLE/$rel"
            grep -q 'empty-ai-project' "$SAMPLE/$rel"
            grep -q 'WEB-AGENT-KIT:AI-ROLES:START' "$SAMPLE/$rel"
          done

      - name: Verify question-aware repository navigation policy
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          RULE="$SAMPLE/.agent-core/rules/repository-navigation.md"
          POLICY="$SAMPLE/.agent-core/routing/context-policy.json"
          ROUTER="$SAMPLE/.agent-core/agents/context-router.md"
          WORKFLOW="$SAMPLE/.agent-core/rules/workflow.md"

          grep -q 'Direct source lookup' "$RULE"
          grep -q 'Relationship / dependency / impact discovery' "$RULE"
          grep -q 'Do.*not.*force.*Graphify.*precise' "$RULE"
          grep -q 'Do not broadly search.*before Graphify' "$RULE"
          grep -q 'Where should I look?' "$RULE"
          grep -q 'What actually exists?' "$RULE"

          grep -q 'Question-type navigation decision' "$ROUTER"
          grep -q 'direct text/symbol/path lookup' "$ROUTER"
          grep -q 'relationship/dependency/ownership/impact' "$ROUTER"
          grep -q 'Direct source lookup' "$WORKFLOW"
          grep -q 'Relationship / dependency / impact discovery' "$WORKFLOW"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          policy = json.loads((sample / '.agent-core/routing/context-policy.json').read_text())
          principles = policy['principles']
          nav = policy['repository_navigation']
          assert policy['version'] == 4
          assert principles['route_by_navigation_question_type'] is True
          assert principles['prefer_targeted_search_for_direct_lookup'] is True
          assert principles['prefer_graphify_for_relationship_discovery_when_fresh'] is True
          assert nav['canonical_rule'] == '.agent-core/rules/repository-navigation.md'
          assert 'rg-or-equivalent-targeted-current-source-search' in nav['direct_lookup']['preferred_progression']
          assert 'graphify-refresh-gate' in nav['relationship_discovery']['preferred_progression']
          PY

      - name: Verify Graphify setup creates and removes temporary current-AI role
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          MOCKBIN="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/graphify.log"
          mkdir -p "$MOCKBIN"
          cat > "$MOCKBIN/graphify" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$*" >> "$GRAPHIFY_TEST_LOG"
          if [[ "${1:-}" == "--version" ]]; then
            echo 'graphify test'
          fi
          exit 0
          SH
          chmod +x "$MOCKBIN/graphify"

          export PATH="$MOCKBIN:$PATH"
          export GRAPHIFY_TEST_LOG="$LOG"

          sha256sum "$SAMPLE/AGENTS.md" "$SAMPLE/CLAUDE.md" "$SAMPLE/GEMINI.md" > "$RUNNER_TEMP/ai-before-graphify.sha"

          python "$SAMPLE/.agent-core/rules/graphify-setup.py" --project "$SAMPLE" --yes
          grep -q '^install --project$' "$LOG"
          test -f "$SAMPLE/.agent-core/state/graphify-bootstrap-role.md"
          grep -q 'Temporary Role — Build the Initial Graphify Project Graph' "$SAMPLE/.agent-core/state/graphify-bootstrap-role.md"
          grep -q 'graphify-setup.py --project . --complete' "$SAMPLE/.agent-core/state/graphify-bootstrap-role.md"

          # Graphify setup must not rewrite project AI instruction files.
          sha256sum -c "$RUNNER_TEMP/ai-before-graphify.sha"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          state = json.loads((sample / '.agent-core/state/graphify-install.json').read_text())
          assert state['installed'] is True
          assert state['configured'] is True
          assert state['initial_graph_required'] is True
          assert state['bootstrap_role_active'] is True
          assert state['current_ai_action_required'] is True
          PY

          # The role cannot be removed before the current AI actually builds the graph.
          set +e
          python "$SAMPLE/.agent-core/rules/graphify-setup.py" --project "$SAMPLE" --complete
          STATUS=$?
          set -e
          test "$STATUS" -eq 2
          test -f "$SAMPLE/.agent-core/state/graphify-bootstrap-role.md"

          # Simulate the current AI successfully building the initial graph, then complete the role.
          mkdir -p "$SAMPLE/graphify-out"
          echo '{"nodes":[],"edges":[]}' > "$SAMPLE/graphify-out/graph.json"
          python "$SAMPLE/.agent-core/rules/graphify-setup.py" --project "$SAMPLE" --complete
          test ! -e "$SAMPLE/.agent-core/state/graphify-bootstrap-role.md"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          state = json.loads((sample / '.agent-core/state/graphify-install.json').read_text())
          assert state['graph_ready'] is True
          assert state['initial_graph_required'] is False
          assert state['bootstrap_role_active'] is False
          assert state['current_ai_action_required'] is False
          PY

      - name: Verify Graph Refresh Gate self-heals all Graphify metadata
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          MOCKBIN="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/graphify-refresh.log"
          export PATH="$MOCKBIN:$PATH"
          export GRAPHIFY_TEST_LOG="$LOG"
          : > "$LOG"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          for rel in ['.agent-kit.json', '.agent-core/index/project-profile.json']:
              p = sample / rel
              data = json.loads(p.read_text())
              data.setdefault('capabilities', {}).setdefault('graphify', {}).update({
                  'detected': False,
                  'graph_ready': False,
                  'routing_mode': 'standard',
              })
              p.write_text(json.dumps(data, indent=2))
          p = sample / '.agent-core/state/graphify-install.json'
          data = json.loads(p.read_text())
          data['graph_ready'] = False
          data['initial_graph_required'] = True
          p.write_text(json.dumps(data, indent=2))
          PY

          python "$SAMPLE/.agent-core/rules/graphify-refresh.py" \
            --project "$SAMPLE" --task-id metadata-sync
          grep -q '^update \.$' "$LOG"

          python - <<'PY'
          import json, os
          from pathlib import Path
          sample = Path(os.environ['RUNNER_TEMP']) / 'web-kit-ai-sample'
          cfg = json.loads((sample / '.agent-kit.json').read_text())
          profile = json.loads((sample / '.agent-core/index/project-profile.json').read_text())
          install = json.loads((sample / '.agent-core/state/graphify-install.json').read_text())
          runtime = json.loads((sample / '.agent-core/state/graphify.json').read_text())
          for source in (cfg, profile):
              graphify = source['capabilities']['graphify']
              assert graphify['detected'] is True
              assert graphify['graph_ready'] is True
              assert graphify['routing_mode'] == 'graphify-assisted'
              assert graphify['dirty'] is False
          assert install['graph_ready'] is True
          assert install['initial_graph_required'] is False
          assert install['observed_routing_mode'] == 'graphify-assisted'
          assert runtime['dirty'] is False
          assert runtime['routing_mode'] == 'graphify-assisted'
          PY

      - name: Verify doctor warns on unmanaged Graphify instructions without deleting them
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          echo '' >> "$SAMPLE/CLAUDE.md"
          echo 'Always run graphify update . after every edit.' >> "$SAMPLE/CLAUDE.md"

          OUTPUT="$RUNNER_TEMP/doctor-ai-conflict.log"
          python scripts/agent-kit.py doctor "$SAMPLE" | tee "$OUTPUT"
          grep -q 'CLAUDE.md: direct Graphify update command outside the managed roles block' "$OUTPUT"
          grep -q 'Status: HEALTHY WITH WARNINGS' "$OUTPUT"
          grep -q 'Always run graphify update . after every edit.' "$SAMPLE/CLAUDE.md"

      - name: Verify npm graphify command routes through Web Kit
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          MOCKBIN="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/graphify-npx.log"
          export PATH="$MOCKBIN:$PATH"
          export GRAPHIFY_TEST_LOG="$LOG"
          : > "$LOG"

          node bin/web-kit.js graphify --ref main --project "$SAMPLE"
          grep -q '^install --project$' "$LOG"
