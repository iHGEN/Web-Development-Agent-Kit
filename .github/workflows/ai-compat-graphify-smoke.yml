name: AI Compatibility + Graphify Smoke

on:
  push:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "bootstrap/**"
      - "scripts/**"
      - "pack/runtime/**"
      - "pack/rules/**"
      - "pack/agents/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/ai-compat-graphify-smoke.yml"
  pull_request:
    paths:
      - "package.json"
      - "VERSION"
      - "bin/**"
      - "bootstrap/**"
      - "scripts/**"
      - "pack/runtime/**"
      - "pack/rules/**"
      - "pack/agents/**"
      - "pack/router/**"
      - "AGENTS.template.md"
      - ".github/workflows/ai-compat-graphify-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Node sources
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/agent-kit.mjs
          node --check scripts/project-profile.mjs
          node --check scripts/ai-compat.mjs
          node --check pack/rules/graphify-setup.mjs
          node --check pack/rules/graphify-refresh.mjs
          node --check pack/runtime/session-controller.mjs
          node --check pack/runtime/context-supervisor.mjs
          node --check pack/runtime/provider-bridge.mjs
          node --check pack/runtime/supervisor-setup.mjs

      - name: Create sample project with existing AI instructions
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          mkdir -p "$SAMPLE/src"
          cat > "$SAMPLE/package.json" <<'JSON'
          {"name":"web-kit-ai-sample","dependencies":{"react":"^19.0.0"}}
          JSON
          echo 'export const value = 1;' > "$SAMPLE/src/index.ts"
          cat > "$SAMPLE/AGENTS.md" <<'TXT'
          # Existing AGENTS instructions

          Keep this project-owned AGENTS content exactly.
          TXT
          cat > "$SAMPLE/CLAUDE.md" <<'TXT'
          # Existing Claude instructions

          Keep this project-owned Claude content exactly.
          TXT
          cat > "$SAMPLE/GEMINI.md" <<'TXT'
          # Existing Gemini instructions

          Keep this project-owned Gemini content exactly.
          TXT
          cp "$SAMPLE/AGENTS.md" "$RUNNER_TEMP/original-AGENTS.md"
          cp "$SAMPLE/CLAUDE.md" "$RUNNER_TEMP/original-CLAUDE.md"
          cp "$SAMPLE/GEMINI.md" "$RUNNER_TEMP/original-GEMINI.md"

      - name: Install Web Kit and verify non-destructive AI roles
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          node scripts/agent-kit.mjs install "$SAMPLE"

          test -f "$SAMPLE/AGENTS.md"
          test -f "$SAMPLE/CLAUDE.md"
          test -f "$SAMPLE/GEMINI.md"
          test -f "$SAMPLE/.github/copilot-instructions.md"
          test -f "$SAMPLE/.cursor/rules/ihgen-web-kit.mdc"
          test ! -e "$SAMPLE/AGENTS.web-kit.md"
          test -f "$SAMPLE/.agent-core/rules/ai-compatibility.md"
          test -f "$SAMPLE/.agent-core/rules/graphify-setup.mjs"
          test -f "$SAMPLE/.agent-core/rules/graphify-refresh.mjs"
          test -f "$SAMPLE/.agent-core/rules/repository-navigation.md"
          test -f "$SAMPLE/.agent-core/rules/context-rollover.md"
          test -f "$SAMPLE/.agent-core/bin/session-controller.mjs"
          test -f "$SAMPLE/.agent-core/bin/context-supervisor.mjs"
          test -f "$SAMPLE/.agent-core/bin/provider-bridge.mjs"
          test -f "$SAMPLE/.agent-core/bin/supervisor-setup.mjs"
          test -f "$SAMPLE/.agent-core/agents/context-rollover-manager.md"
          test ! -e "$SAMPLE/.agent-core/rules/graphify-setup.py"
          test ! -e "$SAMPLE/.agent-core/rules/graphify-refresh.py"

          node - "$SAMPLE" "$RUNNER_TEMP" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const rt = process.argv[3];
          for (const name of ['AGENTS.md','CLAUDE.md','GEMINI.md']) {
            const original = fs.readFileSync(path.join(rt, `original-${name}`), 'utf8');
            const current = fs.readFileSync(path.join(sample, name), 'utf8');
            if (!current.startsWith(original)) throw new Error(`${name} project content changed`);
            if (!current.includes('<!-- WEB-AGENT-KIT:AI-ROLES:START -->')) throw new Error(`${name} roles missing`);
            if (current.includes('<!-- WEB-AGENT-KIT:PROJECT-SUMMARY:START -->')) throw new Error(`${name} should not get generated summary`);
            if (!current.includes('WEB_KIT_CONTEXT_SUPERVISOR_ACTIVE=1') || !current.includes('WEB_KIT_SESSION_CONTROLLER=1')) throw new Error(`${name} rollover roles missing`);
            if ((current.match(/WEB-AGENT-KIT:AI-ROLES:START/g) || []).length !== 1) throw new Error(`${name} duplicate roles`);
          }
          for (const rel of ['.github/copilot-instructions.md','.cursor/rules/ihgen-web-kit.mdc']) {
            const text = fs.readFileSync(path.join(sample, rel), 'utf8');
            if (!text.includes('WEB-AGENT-KIT:PROJECT-SUMMARY:START') || !text.includes('web-kit-ai-sample') || !text.includes('WEB-AGENT-KIT:AI-ROLES:START')) throw new Error(`${rel} missing one-time summary/roles`);
          }
          const cfg = JSON.parse(fs.readFileSync(path.join(sample, '.agent-kit.json'), 'utf8'));
          if (cfg.runtime !== 'node+npm') throw new Error('config runtime mismatch');
          if (cfg.ai_compatibility.runtime !== 'node+npm') throw new Error('AI runtime mismatch');
          if (cfg.ai_compatibility.transparent_context_rollover_threshold_percent !== 50) throw new Error('transparent rollover threshold mismatch');
          if (cfg.ai_compatibility.explicit_session_controller_fallback !== '.agent-core/bin/session-controller.mjs') throw new Error('session fallback metadata mismatch');
          NODE

          node scripts/agent-kit.mjs update "$SAMPLE"
          node - "$SAMPLE" "$RUNNER_TEMP" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const rt = process.argv[3];
          for (const name of ['AGENTS.md','CLAUDE.md','GEMINI.md']) {
            const original = fs.readFileSync(path.join(rt, `original-${name}`), 'utf8');
            const current = fs.readFileSync(path.join(sample, name), 'utf8');
            if (!current.startsWith(original)) throw new Error(`${name} changed on update`);
            if ((current.match(/WEB-AGENT-KIT:AI-ROLES:START/g) || []).length !== 1) throw new Error(`${name} duplicate roles`);
          }
          NODE

      - name: Verify missing instruction files get one-time project summaries
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-empty-ai-sample"
          mkdir -p "$SAMPLE/src"
          echo '{"name":"empty-ai-project","dependencies":{"react":"^19.0.0"}}' > "$SAMPLE/package.json"
          echo 'export const value = 1;' > "$SAMPLE/src/index.ts"
          node scripts/agent-kit.mjs install "$SAMPLE"
          for rel in AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md .cursor/rules/ihgen-web-kit.mdc; do
            grep -q 'WEB-AGENT-KIT:PROJECT-SUMMARY:START' "$SAMPLE/$rel"
            grep -q 'empty-ai-project' "$SAMPLE/$rel"
            grep -q 'WEB-AGENT-KIT:AI-ROLES:START' "$SAMPLE/$rel"
          done

      - name: Verify question-aware navigation and automatic context policy
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          RULE="$SAMPLE/.agent-core/rules/repository-navigation.md"
          ROLLOVER="$SAMPLE/.agent-core/rules/context-rollover.md"
          POLICY="$SAMPLE/.agent-core/routing/context-policy.json"
          ROUTER="$SAMPLE/.agent-core/agents/context-router.md"
          WORKFLOW="$SAMPLE/.agent-core/rules/workflow.md"
          grep -q 'Direct source lookup' "$RULE"
          grep -q 'Relationship / dependency / impact discovery' "$RULE"
          grep -q 'node .agent-core/rules/graphify-refresh.mjs' "$RULE"
          grep -q 'Automatic context rollover' "$ROUTER"
          grep -q 'normal development remains' "$ROLLOVER"
          grep -q 'Relationship / dependency / impact discovery' "$WORKFLOW"
          node - "$POLICY" <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (policy.version !== 7 || policy.runtime !== 'node+npm') process.exit(1);
          if (!policy.principles.web_kit_runtime_requires_node_not_python) process.exit(1);
          if (!policy.principles.transparent_context_rollover_enabled_after_normal_install) process.exit(1);
          if (policy.session_control.default_rollover_threshold_percent !== 50) process.exit(1);
          if (policy.session_control.user_runtime_home !== '~/.web-kit') process.exit(1);
          if (!policy.session_control.normal_provider_commands.includes('codex') || !policy.session_control.normal_provider_commands.includes('claude')) process.exit(1);
          if (policy.session_control.explicit_session_controller_fallback !== '.agent-core/bin/session-controller.mjs') process.exit(1);
          if (policy.repository_navigation.graphify_refresh_gate !== '.agent-core/rules/graphify-refresh.mjs') process.exit(1);
          NODE

      - name: Verify Graphify setup protects AI files and manages temporary role
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          MOCKBIN="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/graphify.log"
          mkdir -p "$MOCKBIN"
          cat > "$MOCKBIN/graphify" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$*" >> "$GRAPHIFY_TEST_LOG"
          if [ "${1:-}" = "install" ]; then
            echo 'GRAPHIFY TRIED TO MODIFY THIS' >> AGENTS.md
            echo 'GRAPHIFY TRIED TO MODIFY THIS' >> CLAUDE.md
          fi
          exit 0
          SH
          chmod +x "$MOCKBIN/graphify"
          export PATH="$MOCKBIN:$PATH"
          export GRAPHIFY_TEST_LOG="$LOG"

          sha256sum "$SAMPLE/AGENTS.md" "$SAMPLE/CLAUDE.md" "$SAMPLE/GEMINI.md" > "$RUNNER_TEMP/ai-before-graphify.sha"
          node "$SAMPLE/.agent-core/rules/graphify-setup.mjs" --project "$SAMPLE" --yes
          grep -q '^install --project$' "$LOG"
          sha256sum -c "$RUNNER_TEMP/ai-before-graphify.sha"

          ROLE="$SAMPLE/.agent-core/state/graphify-bootstrap-role.md"
          test -f "$ROLE"
          grep -q 'node .agent-core/rules/graphify-setup.mjs --project . --complete' "$ROLE"

          set +e
          node "$SAMPLE/.agent-core/rules/graphify-setup.mjs" --project "$SAMPLE" --complete
          STATUS=$?
          set -e
          test "$STATUS" -eq 2
          test -f "$ROLE"

          mkdir -p "$SAMPLE/graphify-out"
          echo '{"nodes":[],"edges":[]}' > "$SAMPLE/graphify-out/graph.json"
          node "$SAMPLE/.agent-core/rules/graphify-setup.mjs" --project "$SAMPLE" --complete
          test ! -e "$ROLE"

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const state = JSON.parse(fs.readFileSync(path.join(sample, '.agent-core/state/graphify-install.json'), 'utf8'));
          if (!state.graph_ready || state.initial_graph_required || state.bootstrap_role_active || state.current_ai_action_required) process.exit(1);
          NODE

      - name: Verify Node Graph Refresh Gate self-heals metadata
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          MOCKBIN="$RUNNER_TEMP/mockbin"
          LOG="$RUNNER_TEMP/graphify-refresh.log"
          export WEB_KIT_GRAPHIFY_BIN="$MOCKBIN/graphify"
          export GRAPHIFY_TEST_LOG="$LOG"
          : > "$LOG"

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          for (const rel of ['.agent-kit.json','.agent-core/index/project-profile.json']) {
            const p = path.join(sample, rel);
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            data.capabilities ||= {};
            data.capabilities.graphify ||= {};
            Object.assign(data.capabilities.graphify, {detected:false, graph_ready:false, routing_mode:'standard'});
            fs.writeFileSync(p, JSON.stringify(data, null, 2));
          }
          NODE

          node "$SAMPLE/.agent-core/rules/graphify-refresh.mjs" --project "$SAMPLE" --task-id metadata-sync
          grep -q '^update \.$' "$LOG"

          node - "$SAMPLE" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sample = process.argv[2];
          const cfg = JSON.parse(fs.readFileSync(path.join(sample, '.agent-kit.json'), 'utf8'));
          const profile = JSON.parse(fs.readFileSync(path.join(sample, '.agent-core/index/project-profile.json'), 'utf8'));
          const runtime = JSON.parse(fs.readFileSync(path.join(sample, '.agent-core/state/graphify.json'), 'utf8'));
          for (const source of [cfg, profile]) {
            const g = source.capabilities.graphify;
            if (!g.detected || !g.graph_ready || g.routing_mode !== 'graphify-assisted' || g.dirty) process.exit(1);
          }
          if (runtime.runtime !== 'node' || runtime.dirty || runtime.routing_mode !== 'graphify-assisted') process.exit(1);
          NODE

      - name: Verify doctor preserves and reports unmanaged Graphify instructions
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/web-kit-ai-sample"
          echo 'Always run graphify update . after every edit.' >> "$SAMPLE/CLAUDE.md"
          OUTPUT="$RUNNER_TEMP/doctor-ai-conflict.log"
          node scripts/agent-kit.mjs doctor "$SAMPLE" | tee "$OUTPUT"
          grep -q 'CLAUDE.md: direct Graphify update command outside the managed roles block' "$OUTPUT"
          grep -q 'Session Controller: OK' "$OUTPUT"
          grep -q 'Context rollover rule: OK' "$OUTPUT"
          grep -q 'Status: HEALTHY WITH WARNINGS' "$OUTPUT"
          grep -q 'Always run graphify update . after every edit.' "$SAMPLE/CLAUDE.md"
