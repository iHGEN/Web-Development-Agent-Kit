name: Apply Security Review Residue Fix

on:
  push:
    branches: [ts-security-review-engine]
    paths:
      - scripts/apply-security-review-residue-fix.mjs
      - .github/workflows/apply-security-review-residue-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ts-security-review-engine
          fetch-depth: 0
      - name: Apply residue fix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-security-review-residue-fix.mjs
          node --check pack/runtime/security-review.mjs
          node --check scripts/agent-kit.mjs
          node --check tests/security-review-smoke.mjs
          node --check tests/fixtures/mock-security-provider.mjs
          node tests/security-review-smoke.mjs
          git diff --check
      - name: Commit source fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-security-review-residue-fix.mjs
          rm .github/workflows/apply-security-review-residue-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack/runtime/security-review.mjs scripts/agent-kit.mjs tests/security-review-smoke.mjs tests/fixtures/mock-security-provider.mjs pack/rules/security-review.md scripts/apply-security-review-residue-fix.mjs .github/workflows/apply-security-review-residue-fix.yml
          git commit -m "Protect security review evidence from Git staging"
          git push origin HEAD:ts-security-review-engine
