name: Apply Untracked Security Evidence Fix

on:
  push:
    branches:
      - ts-security-review-engine
    paths:
      - ".github/workflows/apply-untracked-security-evidence-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ts-security-review-engine
          fetch-depth: 0

      - name: Apply bounded untracked evidence fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(text, before, after, label):
              if before not in text:
                  raise RuntimeError(f"missing patch anchor: {label}")
              return text.replace(before, after, 1)

          engine_path = Path("pack/runtime/security-review.mjs")
          text = engine_path.read_text()

          text = replace_one(
              text,
              'const REVIEW_STATE_PREFIX = `${REVIEW_STATE_REL}/`;\n',
              'const REVIEW_STATE_PREFIX = `${REVIEW_STATE_REL}/`;\n'
              'const UNTRACKED_EVIDENCE_MAX_FILES = 200;\n'
              'const UNTRACKED_EVIDENCE_MAX_BYTES_PER_FILE = 64 * 1024;\n'
              'const UNTRACKED_EVIDENCE_MAX_TOTAL_BYTES = 512 * 1024;\n'
              'const UNTRACKED_EVIDENCE_BINARY_SAMPLE_BYTES = 8 * 1024;\n',
              "untracked evidence constants",
          )

          helper_anchor = 'function changedFiles(project, mergeBase) {\n'
          helpers = r'''function untrackedFiles(project) {
            return gitLines(project, ["ls-files", "--others", "--exclude-standard"])
              .map(posix)
              .filter((file) => !isReviewState(file))
              .sort();
          }
          function readFilePrefix(file, maxBytes) {
            const requested = Math.max(0, Math.floor(Number(maxBytes) || 0));
            if (!requested) return Buffer.alloc(0);
            const buffer = Buffer.alloc(requested);
            const fd = fs.openSync(file, "r");
            try {
              const read = fs.readSync(fd, buffer, 0, requested, 0);
              return buffer.subarray(0, read);
            } finally {
              fs.closeSync(fd);
            }
          }
          function isLikelyBinary(buffer) {
            if (!buffer?.length) return false;
            let suspicious = 0;
            for (const byte of buffer) {
              if (byte === 0) return true;
              if (byte < 7 || (byte > 13 && byte < 32)) suspicious += 1;
            }
            return suspicious / buffer.length > 0.10;
          }
          function collectUntrackedEvidence(project) {
            const files = untrackedFiles(project);
            const records = [];
            const root = path.resolve(project);
            let capturedTextBytes = 0;

            for (const relative of files.slice(0, UNTRACKED_EVIDENCE_MAX_FILES)) {
              const absolute = path.resolve(project, relative);
              if (absolute !== root && !absolute.startsWith(`${root}${path.sep}`)) {
                records.push({ path: relative, status: "SKIPPED_OUTSIDE_PROJECT" });
                continue;
              }

              let stat;
              try { stat = fs.lstatSync(absolute); }
              catch (error) {
                records.push({ path: relative, status: "SKIPPED_UNREADABLE", reason: error?.code || "unreadable" });
                continue;
              }
              if (!stat.isFile()) {
                records.push({ path: relative, status: "SKIPPED_NON_REGULAR", size_bytes: stat.size });
                continue;
              }

              let sample;
              try { sample = readFilePrefix(absolute, Math.min(stat.size, UNTRACKED_EVIDENCE_BINARY_SAMPLE_BYTES)); }
              catch (error) {
                records.push({ path: relative, status: "SKIPPED_UNREADABLE", size_bytes: stat.size, reason: error?.code || "unreadable" });
                continue;
              }
              if (isLikelyBinary(sample)) {
                records.push({ path: relative, status: "SKIPPED_BINARY", size_bytes: stat.size });
                continue;
              }

              const remaining = Math.max(0, UNTRACKED_EVIDENCE_MAX_TOTAL_BYTES - capturedTextBytes);
              if (!remaining) {
                records.push({ path: relative, status: "SKIPPED_TOTAL_LIMIT", size_bytes: stat.size });
                continue;
              }
              const captureLimit = Math.min(stat.size, UNTRACKED_EVIDENCE_MAX_BYTES_PER_FILE, remaining);
              let bytes;
              try { bytes = readFilePrefix(absolute, captureLimit); }
              catch (error) {
                records.push({ path: relative, status: "SKIPPED_UNREADABLE", size_bytes: stat.size, reason: error?.code || "unreadable" });
                continue;
              }
              capturedTextBytes += bytes.length;
              records.push({
                path: relative,
                status: "CAPTURED_TEXT",
                size_bytes: stat.size,
                captured_bytes: bytes.length,
                truncated: stat.size > bytes.length,
                content: bytes.toString("utf8"),
              });
            }

            return {
              schema_version: 1,
              limits: {
                max_files: UNTRACKED_EVIDENCE_MAX_FILES,
                max_bytes_per_file: UNTRACKED_EVIDENCE_MAX_BYTES_PER_FILE,
                max_total_bytes: UNTRACKED_EVIDENCE_MAX_TOTAL_BYTES,
              },
              total_untracked_files: files.length,
              represented_files: records.length,
              omitted_files: Math.max(0, files.length - UNTRACKED_EVIDENCE_MAX_FILES),
              captured_text_bytes: capturedTextBytes,
              files: records,
            };
          }
          function untrackedEvidenceText(evidence) {
            return (evidence?.files || [])
              .filter((item) => item.status === "CAPTURED_TEXT")
              .map((item) => `\n--- WEB KIT UNTRACKED FILE: ${item.path} (${item.captured_bytes}/${item.size_bytes} bytes${item.truncated ? ", truncated" : ""}) ---\n${item.content}`)
              .join("\n");
          }
          function untrackedEvidenceSummary(evidence) {
            return {
              schema_version: evidence.schema_version,
              limits: evidence.limits,
              total_untracked_files: evidence.total_untracked_files,
              represented_files: evidence.represented_files,
              omitted_files: evidence.omitted_files,
              captured_text_bytes: evidence.captured_text_bytes,
              files: (evidence.files || []).map(({ content, ...metadata }) => metadata),
            };
          }

          '''
          if helper_anchor not in text:
              raise RuntimeError("missing patch anchor: changedFiles")
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          text = replace_one(
              text,
              '  const untracked = gitLines(project, ["ls-files", "--others", "--exclude-standard"]);\n',
              '  const untracked = untrackedFiles(project);\n',
              "changedFiles untracked list",
          )

          old_diff = '''function diffText(project, mergeBase) {
            return [
              git(project, ["diff", "--no-ext-diff", "--unified=12", `${mergeBase}...HEAD`]),
              git(project, ["diff", "--cached", "--no-ext-diff", "--unified=12"]),
              git(project, ["diff", "--no-ext-diff", "--unified=12"]),
            ].filter(Boolean).join("\\n");
          }'''
          new_diff = '''function diffText(project, mergeBase, untrackedEvidence) {
            return [
              git(project, ["diff", "--no-ext-diff", "--unified=12", `${mergeBase}...HEAD`]),
              git(project, ["diff", "--cached", "--no-ext-diff", "--unified=12"]),
              git(project, ["diff", "--no-ext-diff", "--unified=12"]),
              untrackedEvidenceText(untrackedEvidence),
            ].filter(Boolean).join("\\n");
          }'''
          text = replace_one(text, old_diff, new_diff, "diffText")

          text = replace_one(
              text,
              'function reviewerPrompt(contextRel, previousRel) {',
              'function reviewerPrompt(contextRel, untrackedEvidenceRel, previousRel) {',
              "reviewerPrompt signature",
          )
          text = replace_one(
              text,
              '- ${contextRel}\\n${previousRel ? `- ${previousRel} (previous review; verify every previous finding and never silently drop one)` : ""}',
              '- ${contextRel}\\n${untrackedEvidenceRel ? `- ${untrackedEvidenceRel} (bounded untracked-file text evidence; inspect CAPTURED_TEXT entries and respect explicit binary/truncation/limit markers)` : ""}\\n${previousRel ? `- ${previousRel} (previous review; verify every previous finding and never silently drop one)` : ""}',
              "reviewer read-first untracked evidence",
          )

          text = replace_one(
              text,
              '  const files = changedFiles(project, mergeBase);\n  const diff = diffText(project, mergeBase);\n  const surfaces = attackSurface(files, diff, args.deep);',
              '  const files = changedFiles(project, mergeBase);\n  const untrackedEvidence = collectUntrackedEvidence(project);\n  const diff = diffText(project, mergeBase, untrackedEvidence);\n  const surfaces = attackSurface(files, diff, args.deep);',
              "main untracked evidence mapping",
          )

          text = replace_one(
              text,
              '    const scanners = persistScannerArtifacts(project, runtimeDir, reviewNumber, scannerResults);\n\n    const context = {',
              '    const scanners = persistScannerArtifacts(project, runtimeDir, reviewNumber, scannerResults);\n'
              '    const untrackedEvidenceFile = untrackedEvidence.total_untracked_files\n'
              '      ? path.join(runtimeDir, `untracked-evidence-${String(reviewNumber).padStart(3, "0")}.json`)\n'
              '      : null;\n'
              '    if (untrackedEvidenceFile) writeJson(untrackedEvidenceFile, untrackedEvidence);\n'
              '    const untrackedEvidenceRel = untrackedEvidenceFile ? posix(path.relative(project, untrackedEvidenceFile)) : null;\n\n'
              '    const context = {',
              "persist untracked evidence",
          )

          text = replace_one(
              text,
              '      working_tree_status: workingTreeStatus(project),\n      attack_surfaces: surfaces,',
              '      working_tree_status: workingTreeStatus(project),\n'
              '      untracked_evidence_file: untrackedEvidenceRel,\n'
              '      untracked_evidence_summary: untrackedEvidenceSummary(untrackedEvidence),\n'
              '      attack_surfaces: surfaces,',
              "context untracked evidence",
          )

          text = replace_one(
              text,
              '      model = invokeProvider(provider, project, reviewerPrompt(contextRel, previousRel), args.timeoutMs);',
              '      model = invokeProvider(provider, project, reviewerPrompt(contextRel, untrackedEvidenceRel, previousRel), args.timeoutMs);',
              "reviewer invocation",
          )

          engine_path.write_text(text)

          test_path = Path("tests/security-review-smoke.mjs")
          test = test_path.read_text()
          marker = 'console.log(`Security Review smoke: PASS (${process.platform})`);'
          regression = r'''// Regression: generic-path untracked file content must deterministically map security surfaces.
          git(project, ["checkout", "main"]);
          git(project, ["checkout", "-b", "untracked-content-surface"]);
          fs.writeFileSync(path.join(project, "src", "new.js"), "export function run(input) { return eval(input); }\n");
          fs.writeFileSync(path.join(project, "src", "blob.bin"), Buffer.from([0, 1, 2, 3, 4, 5]));
          fs.writeFileSync(path.join(project, "src", "large.txt"), "A".repeat(70 * 1024));
          run(process.execPath, [engine, "--project", project, "--base", "main", "--scan-only", "--no-scanners"], { cwd: project, env: baseEnv });
          const untrackedRoot = reviewRoot(project, "untracked-content-surface");
          const untrackedReview = json(path.join(untrackedRoot, "latest.json"));
          assert(untrackedReview.changed_files.includes("src/new.js"), "generic untracked file was not included in changed_files");
          assert(untrackedReview.attack_surfaces.some((area) => area.id === "injection"), "content-only eval signal in generic untracked file did not map Injection & Code Execution");
          const untrackedContext = json(path.join(untrackedRoot, "runtime", "review-context-001.json"));
          assert(untrackedContext.untracked_evidence_file, "untracked evidence file was not recorded in review context");
          const untrackedEvidence = json(path.resolve(project, ...untrackedContext.untracked_evidence_file.split("/")));
          const genericEntry = untrackedEvidence.files.find((item) => item.path === "src/new.js");
          const binaryEntry = untrackedEvidence.files.find((item) => item.path === "src/blob.bin");
          const largeEntry = untrackedEvidence.files.find((item) => item.path === "src/large.txt");
          assert(genericEntry?.status === "CAPTURED_TEXT" && genericEntry.content.includes("eval(input)"), "generic untracked text content was not captured for reviewer evidence");
          assert(binaryEntry?.status === "SKIPPED_BINARY" && !("content" in binaryEntry), "binary untracked file was not safely excluded from text evidence");
          assert(largeEntry?.status === "CAPTURED_TEXT" && largeEntry.truncated === true, "large untracked text file was not bounded/truncated");
          assert(largeEntry.captured_bytes <= untrackedEvidence.limits.max_bytes_per_file, "per-file untracked evidence byte limit was exceeded");
          assert(untrackedEvidence.captured_text_bytes <= untrackedEvidence.limits.max_total_bytes, "total untracked evidence byte limit was exceeded");
          assert(untrackedContext.untracked_evidence_summary.files.every((item) => !("content" in item)), "review context summary duplicated raw untracked content instead of referencing the bounded evidence file");

          '''
          if marker not in test:
              raise RuntimeError("missing patch anchor: security-review smoke final marker")
          test = test.replace(marker, regression + marker, 1)
          test_path.write_text(test)
          PY

          node --check pack/runtime/security-review.mjs
          node --check tests/security-review-smoke.mjs
          node tests/security-review-smoke.mjs
          git diff --check

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-untracked-security-evidence-fix.yml
          git config user.name "Web Kit CI"
          git config user.email "web-kit-ci@users.noreply.github.com"
          git add pack/runtime/security-review.mjs tests/security-review-smoke.mjs .github/workflows/apply-untracked-security-evidence-fix.yml
          git diff --cached --check
          git commit -m "Include bounded untracked content in security review evidence"
          git push origin HEAD:ts-security-review-engine
