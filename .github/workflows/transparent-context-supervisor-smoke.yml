name: Transparent Context Supervisor Smoke

on:
  push:
    paths:
      - "bootstrap/**"
      - "scripts/**"
      - "pack/runtime/**"
      - "pack/rules/context-rollover.md"
      - "pack/agents/context-rollover-manager.md"
      - "pack/router/context-policy.json"
      - "tests/transparent-context-supervisor-smoke.mjs"
      - "tests/fixtures/mock-transparent-provider.mjs"
      - ".github/workflows/transparent-context-supervisor-smoke.yml"
  pull_request:
    paths:
      - "bootstrap/**"
      - "scripts/**"
      - "pack/runtime/**"
      - "pack/rules/context-rollover.md"
      - "pack/agents/context-rollover-manager.md"
      - "pack/router/context-policy.json"
      - "tests/transparent-context-supervisor-smoke.mjs"
      - "tests/fixtures/mock-transparent-provider.mjs"
      - ".github/workflows/transparent-context-supervisor-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transparent-rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate transparent supervisor sources
        shell: bash
        run: |
          set -euo pipefail
          node --check pack/runtime/context-supervisor.mjs
          node --check pack/runtime/provider-bridge.mjs
          node --check pack/runtime/supervisor-setup.mjs
          node --check tests/fixtures/mock-transparent-provider.mjs
          node --check tests/transparent-context-supervisor-smoke.mjs
          node -e "const p=require('./pack/router/context-policy.json'); if(p.version!==7 || !p.session_control?.normal_install_installs_user_supervisor) process.exit(1)"

      - name: Verify normal codex and claude commands roll over transparently
        shell: bash
        run: |
          set -euo pipefail
          node tests/transparent-context-supervisor-smoke.mjs
