name: Create v1.1.14 Tag

on:
  push:
    paths:
      - ".github/workflows/create-v1.1.14-tag.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        shell: bash
        env:
          RELEASE_SHA: 24a886fe23ff9d46397c4a82c960ca8c3d8344ff
          RELEASE_TAG: v1.1.14
          RELEASE_VERSION: 1.1.14
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Refusing to reuse existing tag $RELEASE_TAG" >&2
            exit 2
          fi

          test "$(git show "$RELEASE_SHA:VERSION" | tr -d '\r\n')" = "$RELEASE_VERSION"
          test "$(git show "$RELEASE_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "$RELEASE_VERSION"

          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
